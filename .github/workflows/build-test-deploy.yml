name: build-test-deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prd]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION: Olga.Core.slnx
  IMAGE_NAME: olga-core-api

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$SOLUTION" --configfile NuGet.Config

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test "$SOLUTION"
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=test-results"
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Validate production container build
        run: docker build --file src/Olga.Core.Api/Dockerfile --tag olga-core-api:ci .

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        shell: bash
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Olga.Core.Api/Dockerfile
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Deploy image digest
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          revision_suffix="${GITHUB_SHA:0:12}"

          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 8080 \
            --allow-insecure false \
            --output none

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$image_ref" \
            --revision-suffix "$revision_suffix" \
            --output none

          allow_insecure=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.allowInsecure \
            --output tsv)
          target_port=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.targetPort \
            --output tsv)
          [[ "$allow_insecure" == "false" && "$target_port" == "8080" ]]

          revision=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.latestRevisionName \
            --output tsv)

          for attempt in {1..20}; do
            health=$(az containerapp revision show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$revision" \
              --query properties.healthState \
              --output tsv)
            [[ "$health" == "Healthy" ]] && break
            [[ "$health" == "Unhealthy" || "$health" == "Failed" ]] && exit 1
            [[ "$attempt" == "20" ]] && exit 1
            sleep 15
          done

          {
            echo "### Core API deployment"
            echo "- Environment: \`${DEPLOY_ENVIRONMENT}\`"
            echo "- Revision: \`${revision}\`"
            echo "- Image: \`${image_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
